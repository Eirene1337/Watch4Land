<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch4Land | Maintenance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #100d15;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        .maintenance {
            padding: 40px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
            color: #d698ff;
        }

        p {
            font-size: 20px;
            color: #ccc;
        }

        .dot {
            margin-top: 30px;
            font-size: 40px;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: .3;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="maintenance">

    <h1>We're under maintenance</h1>

</div>

</body>
</html>
